version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Routine updates, grouped. Major versions come as separate PRs, to be reviewed one by one.
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint (used by eslint-config-next) does not support TypeScript 7 yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7"]
      # Types follow the Node.js version in .nvmrc (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
